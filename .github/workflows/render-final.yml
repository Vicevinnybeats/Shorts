name: render-final
# voice -> music + SFX -> mix (ducking + loudness) -> Remotion render in parallel chunks (captions in the picture)
# -> mux -> QA -> MP4 + metadata JSON to Drive /Shorts/Review. Never publishes anything.
on:
  workflow_dispatch:
    inputs:
      episode: { description: "Episode id (folder name under episodes/)", required: true, type: string }
      chunks: { description: "Parallel render jobs (blank = the episode's own setting)", required: false, default: "", type: string }
      dpr: { description: "3D buffer scale (0.5 = 540x960 stretched to 1080x1920; captions stay sharp)", required: false, default: "0.5", type: string }
  push:
    paths: ["episodes/*/GO_FINAL"]

permissions:
  contents: write
  actions: read

concurrency:
  group: final-${{ inputs.episode || github.ref }}
  cancel-in-progress: false

env:
  NARRATOR_ENGINE: ${{ vars.NARRATOR_ENGINE || 'kokoro' }}
  NARRATOR_VOICE: ${{ vars.NARRATOR_VOICE || 'am_liam' }}

jobs:
  voice-and-mix:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      id: ${{ steps.ep.outputs.id }}
      comp: ${{ steps.ep.outputs.comp }}
      frames: ${{ steps.plan.outputs.frames }}
      ranges: ${{ steps.plan.outputs.ranges }}
      gl: ${{ steps.plan.outputs.gl }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Which episode
        id: ep
        run: |
          id="${{ inputs.episode }}"
          if [ -z "$id" ]; then id=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- 'episodes/*/GO_FINAL' 2>/dev/null | head -1 | cut -d/ -f2); fi
          [ -z "$id" ] && id=$(ls episodes/*/GO_FINAL | head -1 | cut -d/ -f2)
          test -f "episodes/$id/episode.json" || { echo "::error::no episode '$id'"; exit 1; }
          test -f "episodes/$id/script.txt" || { echo "::error::episodes/$id/script.txt missing"; exit 1; }
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "comp=$(node -p "require('./episodes/$id/episode.json').composition || 'Ep-$id'")" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup
        with: { render: "false", audio: "true", voice: "true" }
      # Chatterbox (MIT) needs Python 3.11 in its own venv; the job's main Python (3.12) is left untouched
      - uses: actions/setup-python@v5
        id: py311
        with: { python-version: "3.11", update-environment: false }
      - uses: actions/cache@v4
        with: { path: ~/.cache/huggingface, key: hf-chatterbox-v1 }
      - name: Voice (Google AI Studio Gemini "Algieba" by default; Kokoro am_liam fallback)
        env: { VOICE_KEY: "${{ secrets.VOICE_KEY }}", PY311: "${{ steps.py311.outputs.python-path }}", GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}" }
        run: |
          id=${{ steps.ep.outputs.id }}
          B=episodes/$id/build; mkdir -p $B/voice
          OWN=$(ls episodes/$id/voice.{wav,m4a,mp3,aac,ogg} 2>/dev/null | head -1 || true)
          # DEFAULT voice = Kokoro am_liam, natural flow, speed 1.05 (owner 2026-11-21). episode.json "clone": "owner" -> owner's Chatterbox clone;
          # "clone_engine": "openvoice" -> old OpenVoice path. Settings overridable: "exag", "cfg", "ref_start", "pause".
          CLONE=$(node -p "require('./episodes/$id/episode.json').clone || 'none'")
          CENG=$(node -p "require('./episodes/$id/episode.json').clone_engine || 'chatterbox'")
          if [ -z "$OWN" ] && [ "$CLONE" = "owner" ] && [ -z "$VOICE_KEY" ]; then
            echo "::warning::owner voice clone wanted but the VOICE_KEY secret is missing - using Kokoro"; CLONE=none
          fi
          if [ -z "$OWN" ] && [ "$CLONE" = "owner" ] && [ "$CENG" = "chatterbox" ]; then
            EX=$(node -p "require('./episodes/$id/episode.json').exag || 0.65")
            CF=$(node -p "require('./episodes/$id/episode.json').cfg || 0.4")
            RS=$(node -p "require('./episodes/$id/episode.json').ref_start || 20")
            export NARRATOR_GAP=$(node -p "require('./episodes/$id/episode.json').pause || 0.42")
            echo "voice: owner clone (chatterbox) exag $EX cfg $CF pause $NARRATOR_GAP"
            "$PY311" -m venv /tmp/cb
            /tmp/cb/bin/pip install -q --upgrade pip
            /tmp/cb/bin/pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
            /tmp/cb/bin/pip install -q chatterbox-tts soundfile
            openssl enc -d -aes-256-cbc -pbkdf2 -in assets/voice/owner_ref.wav.enc -out $B/voice/ref.wav -pass env:VOICE_KEY
            /tmp/cb/bin/python pipeline/voice/chatterbox_tts.py episodes/$id/script.txt $B/voice/ref.wav $B/voice \
              --exag "$EX" --cfg "$CF" --ref-start "$RS"
            rm -f $B/voice/ref.wav
                        mv $B/voice/voice.wav $B/voice/voice_raw.wav
            # clarity chain (owner: muddy/quiet): no denoise (it smears), less mud at 250 Hz, +6 dB presence at 3 kHz
            EQ=$(node -p "require('./episodes/$id/episode.json').voice_eq || ''")
            [ -n "$EQ" ] || EQ="highpass=f=90,equalizer=f=250:t=q:w=1:g=-4,equalizer=f=3000:t=q:w=1.5:g=6,equalizer=f=6000:t=q:w=1:g=2,acompressor=threshold=-20dB:ratio=3:attack=5:release=100:makeup=3,loudnorm=I=-13:TP=-1:LRA=6"
            ffmpeg -loglevel error -y -i $B/voice/voice_raw.wav -af "$EQ" -ac 1 -ar 24000 $B/voice/voice.wav
            rm -f $B/voice/voice_raw.wav
            python pipeline/voice/align_words.py $B/voice/voice.wav episodes/$id/script.txt $B/voice/words.json
            CLONE=done
          elif [ -n "$OWN" ]; then
            # owner's own recorded narration (default when present): clean mono 24 kHz + word timings from the real voice
            echo "own voice: $OWN"
            ffmpeg -loglevel error -y -i "$OWN" -ac 1 -ar 24000 -af "highpass=f=70,loudnorm=I=-18:TP=-2" $B/voice/voice.wav
            python pipeline/voice/align_words.py $B/voice/voice.wav episodes/${{ steps.ep.outputs.id }}/script.txt $B/voice/words.json
          elif [ "$NARRATOR_ENGINE" = "voicestudio" ]; then
            bash pipeline/voice/voicestudio_tts.sh episodes/${{ steps.ep.outputs.id }}/script.txt $B/voice
            python pipeline/voice/align_words.py $B/voice/voice.wav episodes/${{ steps.ep.outputs.id }}/script.txt $B/voice/words.json
          else
            # owner 2026-11-22: DEFAULT = Google AI Studio (Gemini TTS) voice Algieba; episode.json "tts": "kokoro" opts out,
            # "gemini_voice" overrides. Kokoro below only runs if Gemini is off, has no key, or fails (quota).
            TTS=$(node -p "require('./episodes/$id/episode.json').tts || 'gemini'")
            GDONE=0
            if [ "$TTS" = "gemini" ] && [ -n "$GEMINI_API_KEY" ]; then
              GV=$(node -p "require('./episodes/$id/episode.json').gemini_voice || 'Algieba'")
              echo "voice: gemini $GV"
              if python pipeline/voice/gemini_tts.py episodes/$id/script.txt $B/voice --voice "$GV"; then
                python pipeline/voice/align_words.py $B/voice/voice.wav episodes/$id/script.txt $B/voice/words.json && GDONE=1
              else
                echo "::warning::Gemini TTS failed - falling back to Kokoro"
              fi
            fi
          fi
          if [ -z "$OWN" ] && [ "$CLONE" != "owner" ] && [ "$NARRATOR_ENGINE" != "voicestudio" ] && [ "$GDONE" = "0" ]; then
            V=$(node -p "require('./episodes/${{ steps.ep.outputs.id }}/episode.json').voice || process.env.NARRATOR_VOICE")
            # owner 2026-11-21: am_liam, natural flow (paragraph takes), speed 1.05 = defaults
            # owner 2026-11-22: slower + a space after every sentence, longer pause between beats (script lines)
            SP=$(node -p "require('./episodes/${{ steps.ep.outputs.id }}/episode.json').speed || 0.97")
            export NARRATOR_GAP=$(node -p "require('./episodes/${{ steps.ep.outputs.id }}/episode.json').pause || 0.38")
            export NARRATOR_LINE_GAP=$(node -p "require('./episodes/${{ steps.ep.outputs.id }}/episode.json').line_pause || 0.65")
            export NARRATOR_FLOW=$(node -p "require('./episodes/${{ steps.ep.outputs.id }}/episode.json').flow || 'spaced'")
            echo "voice: $V speed: $SP pause: $NARRATOR_GAP flow: $NARRATOR_FLOW"
            python pipeline/voice/kokoro_tts.py episodes/${{ steps.ep.outputs.id }}/script.txt $B/voice --voice "$V" --speed "$SP"
          fi
          if [ -z "$OWN" ] && [ "$CLONE" = "owner" ] && [ "$CENG" = "openvoice" ]; then
            if [ -n "$VOICE_KEY" ]; then
              # owner's voice clone (OpenVoice V2): Kokoro keeps words + pauses, OpenVoice swaps in the owner's timbre
              openssl enc -d -aes-256-cbc -pbkdf2 -in assets/voice/owner_ref.wav.enc -out $B/voice/ref.wav -pass env:VOICE_KEY
              pip install -q --no-deps "git+https://github.com/myshell-ai/OpenVoice.git"
              pip install -q librosa==0.10.2.post1 unidecode inflect eng_to_ipa pypinyin cn2an jieba huggingface_hub wavmark
              mv $B/voice/voice.wav $B/voice/voice_kokoro.wav
              python pipeline/voice/openvoice_convert.py $B/voice/voice_kokoro.wav $B/voice/ref.wav $B/voice/voice.wav
              rm -f $B/voice/ref.wav
            else
              echo "::warning::episode wants the owner's voice clone but the VOICE_KEY secret is missing - using Kokoro"
            fi
          fi
          cp $B/voice/words.json $B/words.json
      - name: Music + SFX + mix
        run: |
          id=${{ steps.ep.outputs.id }}; B=episodes/$id/build
          snd=episodes/$id/sound.json; [ -f $snd ] || snd=-
          python pipeline/audio/mixdown.py $B/voice/voice.wav $B/words.json $snd $B/audio
      - name: Plan render chunks
        id: plan
        run: |
          id=${{ steps.ep.outputs.id }}
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, math, os
          words = json.load(open(f"episodes/{os.environ['ID']}/build/words.json"))
          frames = max(90, math.ceil((words[-1]["e"] + 0.8) * 30))
          meta = json.load(open(f"episodes/{os.environ['ID']}/episode.json"))
          n = max(1, min(20, int(os.environ.get("CHUNKS") or meta.get("chunks") or 3)))
          step = math.ceil(frames / n)
          ranges = [f"{a}-{min(frames, a + step) - 1}" for a in range(0, frames, step)]
          print(f"frames={frames}")
          # 2.5D (flat SVG) episodes render ~7x faster with CPU compositing (swiftshader); 3D episodes need swangle (WebGL)
          print("gl=" + str(meta.get("gl") or "swiftshader"))
          print("ranges=" + json.dumps(ranges))
          PY
        env: { ID: "${{ steps.ep.outputs.id }}", CHUNKS: "${{ inputs.chunks }}" }
      - uses: actions/upload-artifact@v4
        with: { name: "build-${{ steps.ep.outputs.id }}", path: "episodes/${{ steps.ep.outputs.id }}/build", retention-days: 7 }

  render:
    needs: voice-and-mix
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: true
      matrix:
        range: ${{ fromJSON(needs.voice-and-mix.outputs.ranges) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v4
        with: { name: "build-${{ needs.voice-and-mix.outputs.id }}", path: "episodes/${{ needs.voice-and-mix.outputs.id }}/build" }
      - name: Render frames ${{ matrix.range }}
        env: { DPR: "${{ inputs.dpr || '0.5' }}" }
        run: |
          B=episodes/${{ needs.voice-and-mix.outputs.id }}/build
          node -e "const w=require('./$B/words.json'); require('fs').writeFileSync('props.json', JSON.stringify({words:w, dpr:Number(process.env.DPR)}))"
          npx remotion render src/index.ts "${{ needs.voice-and-mix.outputs.comp }}" "chunk_${{ matrix.range }}.mp4" \
            --props=props.json --frames=${{ matrix.range }} --scale=1 --codec=h264 --crf=17 \
            --pixel-format=yuv420p --gl=${{ needs.voice-and-mix.outputs.gl }} --concurrency=2 --timeout=600000 --log=info
      - uses: actions/upload-artifact@v4
        with: { name: "chunk-${{ matrix.range }}", path: "chunk_${{ matrix.range }}.mp4", retention-days: 3 }

  assemble:
    needs: [voice-and-mix, render]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
      GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
      GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with: { render: "false", audio: "true" }
      - uses: actions/download-artifact@v4
        with: { pattern: "chunk-*", path: chunks, merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { name: "build-${{ needs.voice-and-mix.outputs.id }}", path: build }
      - name: Join chunks + mux the mix (video copied, never re-encoded)
        run: |
          ls chunks | sort -t_ -k2 -n | sed "s#^#file 'chunks/#; s#\$#'#" > list.txt; cat list.txt
          ffmpeg -v error -y -f concat -safe 0 -i list.txt -c copy video.mp4
          id=${{ needs.voice-and-mix.outputs.id }}
          mkdir -p final
          ffmpeg -v error -y -i video.mp4 -i build/audio/mix.wav -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 192k -ar 48000 \
            -shortest -movflags +faststart "final/$id.mp4"
      - name: QA (frames, loudness)
        run: |
          id=${{ needs.voice-and-mix.outputs.id }}
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate:format=duration -of compact final/$id.mp4 | tee final/$id.qa.txt
          ffmpeg -hide_banner -nostats -i final/$id.mp4 -af ebur128=peak=true -f null - 2>&1 | grep -A12 "Summary" | tee -a final/$id.qa.txt
          # motion check (no still picture over 3 s, frame 0 not empty) - warns, never blocks
          node scripts/motion-check.mjs final/$id.mp4 3 | tee -a final/$id.qa.txt || echo "::warning::motion check: picture holds still over 3 s (see qa.txt)"
      - name: Metadata JSON next to the MP4
        run: |
          id=${{ needs.voice-and-mix.outputs.id }}
          if [ -f episodes/$id/metadata.json ]; then cp episodes/$id/metadata.json final/$id.json; else echo "::warning::episodes/$id/metadata.json missing"; fi
          cp build/audio/mix_report.json final/$id.mix.json
      - uses: actions/upload-artifact@v4
        with: { name: "final-${{ needs.voice-and-mix.outputs.id }}", path: final, retention-days: 14 }
      - name: Small preview in the repo (720x1280, for review on the phone and in Claude)
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: |
          id=${{ needs.voice-and-mix.outputs.id }}
          ffmpeg -v error -y -i final/$id.mp4 -vf scale=720:-2 -c:v libx264 -crf 30 -preset slow -c:a aac -b:a 96k -movflags +faststart episodes/$id/preview.mp4
          du -h episodes/$id/preview.mp4
          bash scripts/commit-push.sh "preview: $id (run ${{ github.run_id }})" episodes/$id/preview.mp4
      - name: Upload to Drive /Shorts/Review
        run: bash scripts/drive.sh up final "Review/${{ needs.voice-and-mix.outputs.id }}"

  log:
    needs: [voice-and-mix, render, assemble]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env: { GITHUB_TOKEN: "${{ github.token }}" }
    steps:
      - uses: actions/checkout@v4
      - name: Log minutes
        run: python3 pipeline/log_run.py render-final "${{ needs.voice-and-mix.outputs.id || '-' }}" "${{ needs.assemble.result }}"
      - name: Commit render log
        run: |
          bash scripts/commit-push.sh "render-final log: ${{ needs.voice-and-mix.outputs.id }} (run ${{ github.run_id }})" brain
