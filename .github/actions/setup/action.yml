name: Setup render toolchain
description: Node + Remotion (+ cached browser), the animation skill fetched fresh, cached CC0 props, optional Python/ffmpeg/voice.
inputs:
  render:
    description: Install Node, Remotion, browser, skill and 3D props
    default: "true"
  audio:
    description: Python 3.12 + numpy/scipy for the skill's synth audio and mix
    default: "false"
  voice:
    description: Kokoro TTS + faster-whisper (CPU)
    default: "false"
runs:
  using: composite
  steps:
    - name: Remotion temp folder on the runner's temp disk
      shell: bash
      run: |
        echo "REMOTION_TMP=${RUNNER_TEMP}/remotion-tmp" >> "$GITHUB_ENV"
        mkdir -p "${RUNNER_TEMP}/remotion-tmp"

    - if: inputs.render == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - if: inputs.render == 'true'
      id: nm
      uses: actions/cache@v4
      with:
        path: node_modules
        key: nm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-v1

    - if: inputs.render == 'true' && steps.nm.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci --no-audit --no-fund

    - if: inputs.render == 'true'
      name: Browser libraries + Remotion headless browser (cached inside node_modules)
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq libnss3 libdbus-1-3 libatk1.0-0 libgbm1 libasound2t64 libxrandr2 libxkbcommon0 \
          libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 ffmpeg >/dev/null
        npx remotion browser ensure

    - if: inputs.render == 'true'
      name: Animation skill (cloned fresh every run, never committed)
      shell: bash
      run: bash scripts/fetch-skill.sh

    - if: inputs.render == 'true'
      id: kenney
      uses: actions/cache@v4
      with:
        path: public/bridge/kenney
        key: kenney-cc0-v1

    - if: inputs.render == 'true' && steps.kenney.outputs.cache-hit != 'true'
      name: Fetch CC0 3D props (only when the cache is cold)
      shell: bash
      run: bash scripts/fetch-assets.sh

    - if: inputs.render == 'true'
      shell: bash
      run: node scripts/gen-registry.mjs

    - if: inputs.audio == 'true' || inputs.voice == 'true'
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: pipeline/requirements-*.txt

    - if: inputs.audio == 'true' || inputs.voice == 'true'
      shell: bash
      run: |
        command -v ffmpeg >/dev/null || { sudo apt-get update -qq; sudo apt-get install -y -qq ffmpeg >/dev/null; }
        pip install -q -r pipeline/requirements-audio.txt
        [ -d vendor/audio ] || bash scripts/fetch-skill.sh

    - if: inputs.voice == 'true'
      id: hf
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/huggingface
        key: hf-kokoro-whisper-v1

    - if: inputs.voice == 'true'
      shell: bash
      run: |
        sudo apt-get install -y -qq espeak-ng >/dev/null || true
        pip install -q torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
        pip install -q -r pipeline/requirements-voice.txt
